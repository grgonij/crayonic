# Builds crayonic for Windows and macOS on GitHub's servers every time you push.
# Download the results from the "Actions" tab (Artifacts), or push a tag like v0.2.0
# to also publish them on the repository's "Releases" page.

name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:            # adds a "Run workflow" button in the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}

    steps:
      - name: Get the code (and JUCE)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      # ---------- Windows ----------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "build/MyPlugin_artefacts/Release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "$out/VST3/*.vst3" dist/
          Copy-Item "$out/Standalone/*.exe" dist/
          Copy-Item Distribution/README-Windows.txt "dist/READ ME FIRST.txt"
          Copy-Item "Distribution/crayonic Quick Start Guide.pdf" dist/
          Copy-Item Assets/OFL.txt "dist/Font license (OFL).txt"
          Compress-Archive -Path dist/* -DestinationPath "crayonic-Windows.zip"

      # ---------- macOS ----------
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          out="build/MyPlugin_artefacts/Release"
          mkdir -p dist
          cp -R "$out"/VST3/*.vst3 "$out"/AU/*.component "$out"/Standalone/*.app dist/
          # Ad-hoc signature: required for Apple Silicon. (Not a paid Apple signature, so
          # friends still need install.command once - see the read-me.)
          for bundle in dist/*.vst3 dist/*.component dist/*.app; do
            codesign --force --deep --sign - "$bundle"
          done
          cp Distribution/install.command dist/ && chmod +x dist/install.command
          cp Distribution/README-Mac.txt "dist/READ ME FIRST.txt"
          cp "Distribution/crayonic Quick Start Guide.pdf" dist/
          cp Assets/OFL.txt "dist/Font license (OFL).txt"
          ditto -c -k --keepParent dist crayonic-macOS.zip   # ditto keeps Mac bundles and permissions intact

      # Check the Audio Unit with Apple's own validator (results show in the log)
      - name: Validate Audio Unit (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          manu=$(grep -oE 'PLUGIN_MANUFACTURER_CODE +[A-Za-z0-9]{4}' CMakeLists.txt | awk '{print $2}')
          code=$(grep -oE 'PLUGIN_CODE +[A-Za-z0-9]{4}' CMakeLists.txt | awk '{print $2}')
          auval -v aumu "$code" "$manu"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: crayonic-${{ matrix.name }}
          path: crayonic-${{ matrix.name }}.zip

      - name: Publish release (only for version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: crayonic-${{ matrix.name }}.zip
